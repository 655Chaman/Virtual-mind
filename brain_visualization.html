<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elesium Core | Neural Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'JetBrains+Mono', monospace;
            color: #c9a84c;
        }
        canvas {
            display: block;
        }
        /* Futuristic HUD elements */
        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .hud-corner {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(201, 168, 76, 0.2);
        }
        .top-left { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .top-right { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        #core-label {
            position: absolute;
            top: 40px;
            left: 60px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(201, 168, 76, 0.6);
        }
        #system-status {
            position: absolute;
            bottom: 40px;
            left: 60px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .status-item { margin-bottom: 5px; }
        .blinker {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #c9a84c;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
        #activation-prompt {
            position: absolute;
            bottom: 40px;
            right: 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="hud-container">
        <div class="hud-corner top-left"></div>
        <div class="hud-corner top-right"></div>
        <div id="core-label">Elesium Core v2.0</div>
        <div id="system-status">
            <div class="status-item"><span class="blinker"></span>NEURAL LINK: ACTIVE</div>
            <div class="status-item">SYNC_STABILITY: 98.4%</div>
            <div class="status-item">VIRTUAL_MIND_SYNC: RUNNING</div>
        </div>
        <div id="activation-prompt">[ CLICK TO INITIATE SYNAPSE BURST ]</div>
    </div>

    <!-- Three.js & Post-processing Stack -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    
    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, // strength
            0.4, // radius
            0.85 // threshold
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x2a2000, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xc9a84c, 2, 20);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // --- BACKGROUND STARFIELD ---
        const starGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for (let i = 0; i < 2000; i++) {
            let x = (Math.random() - 0.5) * 100;
            let y = (Math.random() - 0.5) * 100;
            let z = (Math.random() - 0.5) * 100;
            starCoords.push(x, y, z);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xc9a84c, size: 0.05, transparent: true, opacity: 0.5 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- NEURAL NETWORK BRAIN ---
        const brainGroup = new THREE.Group();
        scene.add(brainGroup);

        const numNodes = 24;
        const nodes = [];
        const nodeMaterial = new THREE.MeshStandardMaterial({
            color: 0xc9a84c,
            emissive: 0xc9a84c,
            emissiveIntensity: 0.8,
            metalness: 1,
            roughness: 0
        });
        const nodeGeo = new THREE.SphereGeometry(0.1, 16, 16);

        for (let i = 0; i < numNodes; i++) {
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos((Math.random() * 2) - 1);
            let r = 2 + Math.random() * 0.5;
            
            // Brain-like distribution (more horizontal, split hemispheres)
            let x = r * Math.sin(phi) * Math.cos(theta);
            let y = r * Math.cos(phi) * 0.7; // Flattened Y
            let z = r * Math.sin(phi) * Math.sin(theta);
            
            // Asymmetry + Gap
            if (Math.abs(x) < 0.3) x += x > 0 ? 0.4 : -0.4;
            
            const mesh = new THREE.Mesh(nodeGeo, nodeMaterial.clone());
            mesh.position.set(x, y, z);
            mesh.userData = { 
                phase: Math.random() * Math.PI, 
                originalPos: mesh.position.clone(),
                connections: []
            };
            brainGroup.add(mesh);
            nodes.push(mesh);
        }

        // --- EDGES & SYNAPSES ---
        const edges = [];
        const lineMat = new THREE.LineBasicMaterial({ color: 0xc9a84c, transparent: true, opacity: 0.2 });
        
        nodes.forEach((n1, i) => {
            let dists = nodes.map((n2, j) => ({ index: j, d: n1.position.distanceTo(n2.position) }))
                             .sort((a, b) => a.d - b.d);
            
            for (let k = 1; k < 5; k++) {
                let n2 = nodes[dists[k].index];
                const points = [n1.position, n2.position];
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, lineMat.clone());
                brainGroup.add(line);
                edges.push({ line, start: n1, end: n2 });
                n1.userData.connections.push({ target: n2, line: line });
            }
        });

        // --- SYNAPSE PARTICLES (SIGNAL TRAFFIC) ---
        const signalCount = 40;
        const signals = [];
        const signalMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const signalGeo = new THREE.SphereGeometry(0.03, 8, 8);

        for(let i=0; i<signalCount; i++) {
            const mesh = new THREE.Mesh(signalGeo, signalMaterial);
            mesh.visible = false;
            scene.add(mesh);
            signals.push({
                mesh: mesh,
                active: false,
                t: 0,
                speed: 0.01 + Math.random() * 0.02,
                edge: null
            });
        }

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-1, -1);
        let isHovered = false;
        let isBurst = false;
        let burstTime = 0;

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('click', () => {
            isBurst = true;
            burstTime = 1.0;
            bloomPass.strength = 4.0;
            document.getElementById('activation-prompt').innerText = "[ SYNAPSE BURST INITIATED ]";
            setTimeout(() => {
                document.getElementById('activation-prompt').innerText = "[ CLICK TO INITIATE SYNAPSE BURST ]";
            }, 1000);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta();
            let time = clock.getElapsedTime();

            // Hover Check
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);
            isHovered = intersects.length > 0;

            // Brain Sway & Rotation
            brainGroup.rotation.y += (isHovered ? 0.01 : 0.003);
            brainGroup.position.y = Math.sin(time * 0.5) * 0.1;
            
            // Bloom normalization
            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, isHovered ? 2.5 : 1.5, 0.05);

            // Node Pulsing
            nodes.forEach(node => {
                let pulse = 1 + Math.sin(time * 2 + node.userData.phase) * 0.15;
                node.scale.set(pulse, pulse, pulse);
                node.material.emissiveIntensity = isBurst ? 5.0 : pulse * (isHovered ? 2 : 1);
            });

            // Signal Management
            signals.forEach(sig => {
                if(!sig.active && Math.random() < 0.02) {
                    let edge = edges[Math.floor(Math.random() * edges.length)];
                    sig.edge = edge;
                    sig.active = true;
                    sig.mesh.visible = true;
                    sig.t = 0;
                }
                
                if(sig.active) {
                    sig.t += sig.speed * (isBurst ? 3 : 1);
                    if(sig.t >= 1) {
                        sig.active = false;
                        sig.mesh.visible = false;
                    } else {
                        sig.mesh.position.lerpVectors(sig.edge.start.position, sig.edge.end.position, sig.t);
                        sig.mesh.position.applyMatrix4(brainGroup.matrixWorld);
                    }
                }
            });

            // Burst decay
            if(isBurst) {
                burstTime -= dt;
                if(burstTime <= 0) isBurst = false;
            }

            // Camera follow mouse slightly
            camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(0,0,0);

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
